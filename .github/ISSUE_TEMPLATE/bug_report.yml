name: Bug report
description: Report a reproducible AgentLab defect.
title: "bug: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Do not include credentials, private thinking, raw sessions, or local
        AgentLab artifacts. Report security-sensitive defects through SECURITY.md.
  - type: input
    id: version
    attributes:
      label: AgentLab version or commit
      description: Output of `agentlab --version`, or the Git commit.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: OS, architecture, Go version, and whether the run is owned or attached.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Include sanitized commands and inputs sufficient to reproduce the behavior.
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: Include sanitized output, error text, and the relevant public event kind.
    validations:
      required: true
