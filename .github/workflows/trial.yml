name: Trial

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  trial:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      AGENTLAB_WORKER_TOKEN: ${{ secrets.AGENTLAB_WORKER_TOKEN }}
      AGENTLAB_CODER_TOKEN: ${{ secrets.AGENTLAB_CODER_TOKEN }}
      AGENTLAB_SUPERVISOR_TOKEN: ${{ secrets.AGENTLAB_SUPERVISOR_TOKEN }}
      AGENTLAB_PROVIDER: ${{ secrets.AGENTLAB_PROVIDER }}
      AGENTLAB_MODEL: ${{ secrets.AGENTLAB_MODEL }}
      AGENTLAB_THINKING: ${{ secrets.AGENTLAB_THINKING }}
      AGENTLAB_COMPACTION: ${{ secrets.AGENTLAB_COMPACTION }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Install the pinned Pi SDK
        run: sudo -n env PATH="$PATH" npm install -g @earendil-works/pi-coding-agent@0.83.0
      - name: Require authorized credentials
        run: |
          if [ -z "$AGENTLAB_WORKER_TOKEN" ] || [ -z "$AGENTLAB_CODER_TOKEN" ] || [ -z "$AGENTLAB_SUPERVISOR_TOKEN" ] \
             || [ -z "$AGENTLAB_PROVIDER" ] || [ -z "$AGENTLAB_MODEL" ] || [ -z "$AGENTLAB_THINKING" ] || [ -z "$AGENTLAB_COMPACTION" ]; then
            echo "::error::trial requires AGENTLAB_WORKER/CODER/SUPERVISOR_TOKEN and provider/model/thinking/compaction secrets"
            exit 1
          fi
      - name: Preflight and baseline
        run: |
          set -euo pipefail
          run_root() {
            sudo -n env PATH="$PATH" HOME=/root GOPATH=/root/go GOCACHE=/tmp/go-cache \
              XAI_API_KEY="$AGENTLAB_WORKER_TOKEN" \
              AGENTLAB_WORKER_TOKEN="$AGENTLAB_WORKER_TOKEN" \
              AGENTLAB_CODER_TOKEN="$AGENTLAB_CODER_TOKEN" \
              AGENTLAB_SUPERVISOR_TOKEN="$AGENTLAB_SUPERVISOR_TOKEN" "$@"
          }
          SDK_ROOT=$(dirname "$(dirname "$(readlink -f "$(which pi)")")")
          NODE=$(readlink -f "$(which node)")
          run_root make skill >/dev/null
          run_root go build -o /tmp/agentlab ./cmd/agentlab
          run_root rm -rf /root/agentlab-eval /root/agentlab-audit /root/agentlab-host
          echo "===== STEP 2: preflight (live canary) ====="
          run_root /tmp/agentlab acceptance preflight \
            --evaluated-root /root/agentlab-eval --audit-root /root/agentlab-audit \
            --host-root /root/agentlab-host \
            --skill-root "$PWD/dist/skill" --sdk-root "$SDK_ROOT" --node "$NODE" \
            --provider "$AGENTLAB_PROVIDER" --model "$AGENTLAB_MODEL" \
            --thinking "$AGENTLAB_THINKING" --compaction "$AGENTLAB_COMPACTION" \
            --provider-credential-env XAI_API_KEY \
            --worker-credential-handle AGENTLAB_WORKER_TOKEN \
            --coder-credential-handle AGENTLAB_CODER_TOKEN \
            --supervisor-credential-handle AGENTLAB_SUPERVISOR_TOKEN | tee /tmp/step-preflight.json
          echo "===== STEP 3a: additional baseline prepared run (smoke) ====="
          echo '{"run_id":"baseline-2"}' > /tmp/req-baseline.json
          run_root /tmp/agentlab acceptance prepare-baseline --host-root /root/agentlab-host \
            --request /tmp/req-baseline.json | tee /tmp/step-baseline.json || true
          echo "===== STEP 3b: supervisor-start ====="
          run_root /tmp/agentlab acceptance supervisor-start --host-root /root/agentlab-host \
            | tee /tmp/step-supervisor-start.json
          echo "===== STEP 3b2: direct worker start diagnostic (throwaway root) ====="
          run_root rm -rf /root/diag-eval /root/diag-audit /root/diag-host
          run_root /tmp/agentlab acceptance preflight \
            --evaluated-root /root/diag-eval --audit-root /root/diag-audit --host-root /root/diag-host \
            --skill-root "$PWD/dist/skill" --sdk-root "$SDK_ROOT" --node "$NODE" \
            --provider "$AGENTLAB_PROVIDER" --model "$AGENTLAB_MODEL" \
            --thinking "$AGENTLAB_THINKING" --compaction "$AGENTLAB_COMPACTION" \
            --provider-credential-env XAI_API_KEY \
            --worker-credential-handle AGENTLAB_WORKER_TOKEN \
            --coder-credential-handle AGENTLAB_CODER_TOKEN \
            --supervisor-credential-handle AGENTLAB_SUPERVISOR_TOKEN >/dev/null 2>&1 || echo "diag preflight failed"
          echo '{"action":"start","decision":{"action":"worker_start","claim":"fresh Worker starts","falsifier":"Worker did not start","id":"diag-start","worker_run":"baseline-worker","evidence_through":0},"effect_id":"diag-start","run_id":"baseline-worker","runtime_ref":"baseline-worker"}' \
            | run_root /tmp/agentlab tool invoke -root /root/diag-eval -preparation deployctl-preparation \
              -experiment deployctl-supervision -pi-runtime-plan /root/diag-host/pi-runtime-plan.json \
              -name agentlab_run 2>&1 | head -c 500; echo
      - name: Poll the Supervisor and dump state
        run: |
          set -euo pipefail
          run_root() {
            sudo -n env PATH="$PATH" HOME=/root GOPATH=/root/go GOCACHE=/tmp/go-cache \
              XAI_API_KEY="$AGENTLAB_WORKER_TOKEN" \
              AGENTLAB_WORKER_TOKEN="$AGENTLAB_WORKER_TOKEN" \
              AGENTLAB_CODER_TOKEN="$AGENTLAB_CODER_TOKEN" \
              AGENTLAB_SUPERVISOR_TOKEN="$AGENTLAB_SUPERVISOR_TOKEN" "$@"
          }
          echo "===== STEP 3c: supervisor direct diagnostic (stderr captured) ====="
          DIAG_SDK=$(dirname "$(dirname "$(readlink -f "$(which pi)")")")
          DIAG_NODE=$(readlink -f "$(which node)")
          sudo -n rm -rf /tmp/diag-supervisor && sudo -n mkdir -p /tmp/diag-supervisor
          sudo -n env PATH="$PATH" HOME=/tmp/diag-supervisor PI_CODING_AGENT_DIR=/tmp/diag-supervisor PI_CODING_AGENT_SESSION_DIR=/tmp/diag-supervisor \
            XAI_API_KEY="$AGENTLAB_WORKER_TOKEN" AGENTLAB_SUPERVISOR_TOKEN="$AGENTLAB_SUPERVISOR_TOKEN" \
            AGENTLAB_WORKER_TOKEN="$AGENTLAB_WORKER_TOKEN" AGENTLAB_CODER_TOKEN="$AGENTLAB_CODER_TOKEN" \
            AGENTLAB_ROOT=/root/agentlab-eval AGENTLAB_PREPARATION=deployctl-preparation AGENTLAB_EXPERIMENT=deployctl-supervision \
            AGENTLAB_PI_RUNTIME_PLAN=/root/agentlab-host/pi-runtime-plan.json \
            timeout 90 "$DIAG_NODE" "$DIAG_SDK/dist/cli.js" --session /tmp/diag-supervisor/s.jsonl --session-dir /tmp/diag-supervisor \
            --provider "$AGENTLAB_PROVIDER" --model "$AGENTLAB_MODEL" --thinking "$AGENTLAB_THINKING" \
            --no-extensions --extension "$PWD/dist/skill/extension.ts" --no-builtin-tools --no-skills \
            --skill "$PWD/dist/skill/SKILL.md" --no-prompt-templates --no-themes --no-context-files --no-approve \
            --append-system-prompt "$PWD/dist/skill/SKILL.md" \
            --tools agentlab_apply,agentlab_run,agentlab_inspect,agentlab_compare \
            --print "Diagnostic: reply with exactly DIAG_OK" > /tmp/diag-out.txt 2>&1 || true
          echo "--- diag stderr/stdout ---"; head -30 /tmp/diag-out.txt
          echo "diag session bytes: $(sudo -n wc -c < /tmp/diag-supervisor/s.jsonl 2>/dev/null || echo 0)"
          echo "===== STEP 3d: poll supervisor-status (up to 28 min) ====="
          DEADLINE=$((SECONDS + 900))
          while [ $SECONDS -lt $DEADLINE ]; do
            OBS=$(run_root /tmp/agentlab acceptance supervisor-status --host-root /root/agentlab-host 2>/dev/null | grep -o '"observation":"[a-z]*"' || true)
            echo "t+$((SECONDS/60))m ${OBS:-unavailable}"
            if echo "$OBS" | grep -q '"observation":"dead"'; then echo "supervisor exited"; break; fi
            sleep 20
          done
          echo "===== supervisor tool calls (jq) ====="
          run_root sh -c 'jq -r "select(.type==\"message\") | .message.content[]? | select(.type==\"toolCall\") | \"CALL \" + .name + \" \" + (.arguments|tojson)" /root/agentlab-host/supervisor-runtime/session.jsonl 2>/dev/null | tail -50' || true
          run_root sh -c 'jq -r "select(.type==\"message\") | .message.content[]? | select(.type==\"toolResult\") | \"RESULT \" + ((.content[0].text // .content[0].toString()) // \"\")" /root/agentlab-host/supervisor-runtime/session.jsonl 2>/dev/null | tail -50' || true
          echo "===== experiment run ledgers (tail) ====="
          run_root sh -c 'for f in /root/agentlab-eval/experiments/deployctl-supervision/runs/*/events.jsonl; do echo "--- $f"; tail -6 "$f"; done' || true
          echo "===== host root files ====="
          run_root sh -c 'find /root/agentlab-host -maxdepth 3 -type f | sort'
          echo "===== coder completion ====="
          run_root sh -c 'jq -c "select(.kind==\"coder_completed\") | .data.receipt" /root/agentlab-eval/experiments/deployctl-supervision/runs/coder-repair/events.jsonl 2>/dev/null | tail -1' || true
          echo "trial-observation-complete"
